function simulateInvoice(action){const i=invoiceBook.find(i=>i.id===invoiceUI.activeId);if(!i||i.status!=='PROCESSING')return;i.revision++;if(action==='correction'){i.status='NEEDS_CORRECTION';i.correction='当前邮箱地址需重新核对，请确认能够接收邮件。';}else{i.status='ISSUED';i.issued={number:'DEMO20260927'+String(i.number).slice(-4),date:'2026-09-27',sent:'2026-09-27T12:00:00+08:00'};}noticeBook.unshift({id:'notice-'+i.id+'-'+i.revision,title:action==='correction'?'开票信息需要补正':'发票已开具',summary:action==='correction'?'请核对接收邮箱后重新提交':'服务人员已确认发送，请查收邮箱',time:'刚刚',read:false,kind:'invoice',invoiceId:i.id});wallet.tab='invoices';state.route='points';render();open('invoice-detail');paintInvoiceLab();}

function impressionThemes(){const industrial=state.brand==='hengchuan',p=industrial?['参数清晰','配套支持','交付范围清楚','应用描述具体','服务联系方便']:['服务清晰','选择灵活','预约方式明确','服务范围清楚','沟通渠道可见'],n=industrial?['差异化不具体','适用条件有限','售后表述不具体','交期说明不足','规格对比不充分']:['特色较笼统','场景说明有限','服务边界不清晰','价格信息较少','售后表述不具体'];const sizes={balanced:[2,2],uneven:[5,1],reverse:[1,5],one:[3,0],empty:[0,0]}[impressionUI.sample];return {positive:p.slice(0,sizes[0]).map((label,i)=>({label,count:[6,4,3,2,1][i],id:'p'+i})),negative:n.slice(0,sizes[1]).map((label,i)=>({label,count:[3,2,2,1,1][i],id:'n'+i}))};}
function traitExample(v,c){if(v.primaryIndustryId==='IND-09')return /配套|支持/.test(c.title)?'如提供安装清单，交付后可预约远程调试':'如可适配的设备规格、使用条件与交付范围';return /预约/.test(c.title)?'如周末可预约，提前一天确认上门时段':/售后|支持|沟通/.test(c.title)?'如服务完成后可通过原客服反馈问题':/流程|范围/.test(c.title)?'如上门前确认项目，完成后按清单逐项验收':'如具体怎么做，适用于哪些情况';}

const dateContext={year:2026,timeZone:'Asia/Shanghai'};
function dateText(value,full=false,withTime=true){if(!value)return '';if(['刚刚','已结束'].includes(value))return value;const raw=String(value),d=new Date(/^\d{4}-\d{2}-\d{2}$/.test(raw)?raw+'T12:00:00+08:00':raw);if(Number.isNaN(d.getTime()))return raw;const p=Object.fromEntries(new Intl.DateTimeFormat('zh-CN',{timeZone:dateContext.timeZone,year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return (full||Number(p.year)!==dateContext.year?p.year+'年':'')+p.month+'月'+p.day+'日'+(withTime&&raw.includes('T')?' '+p.hour+':'+p.minute:'');}
const perceptionTextUI={long:false,expanded:false};
function perceptionText(){const intro=state.brand==='hengchuan'?'多数回答将品牌理解为提供工业设备及配套支持的服务方，能够说明主要产品和基础应用场景。部分回答对设备适配条件、交付方式和后续支持的描述仍比较概括，品牌之间的差异尚未得到充分体现。以上反映本轮回答中的认识，不替代实际产品说明。':'多数回答将品牌理解为面向家庭的清洁服务提供方，能够识别日常清洁与专项保洁等主要服务。部分回答提到了按场景选择和服务沟通，但对实际操作方法、服务边界及适用条件的描述还比较概括，品牌特色尚未得到充分体现。这是本轮回答中的认识，不替代品牌的实际服务承诺。';return intro+(perceptionTextUI.long?'\n\n在不同问题中，品牌被介绍的角度并不完全相同。点名询问时，回答会更集中地描述品牌的主要服务；在更开放的需求问题中，回答往往先介绍服务类别，再把品牌放在多个可选对象之中。这里的描述反映当前样本，不代表所有平台在所有时间都采用同样的表述。\n\n已有回答中的一些积极印象来自服务内容与选择方式，但具体条件仍需结合原始回答阅读。例如，回答提及能够沟通需求，并不等于已经证明支持所有定制要求；回答没有展开某项细节，也不意味着品牌实际没有提供相应能力。\n\n因此，品牌认识的完整内容需要与主题依据、原始回答保持关联。前端可以按阅读长度展开，但不应自行删除限定条件，或把当前采样中的描述改写为经过外部核验的品牌事实。':'' );}
function perceptionReading(){const text=perceptionText(),long=text.length>180;return `<section class="s-brand-reading" aria-labelledby="s-brand-reading-title"><h2 id="s-brand-reading-title">AI 如何认识品牌</h2><div id="s-brand-reading-text" class="s-brand-reading-text ${long&&!perceptionTextUI.expanded?'is-collapsed':''}">${text.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}</div>${long?button(perceptionTextUI.expanded?'收起全文 '+icon('chevron-up'):'展开全文 '+icon('chevron-down'),`data-toggle-perception="true" aria-expanded="${perceptionTextUI.expanded}" aria-controls="s-brand-reading-text"`,'s-quiet'):''}</section>`;}

function open(type,source){if(type==='support'||type==='support-contact'){navigate('support');return;}if(type==='account'){navigate('points');return;}if(type==='identity'||type==='writing'){state.route='profile';if(!profileBuffer)beginProfileEdit();else{state.profileEdit=true;render();}return;}if(source&&base.contains(source))trigger=source;state.overlay=type;const [title,body]=overlayContent(type),modal=['confirm','regenerate','switch','purchase-final','industry','invoice-form'].includes(type);layer.innerHTML=`<div class="s-overlay"><section class="${modal?'s-dialog':'s-drawer'}" role="dialog" aria-modal="true" aria-labelledby="s-layer-title"><div class="s-overlay-head"><h2 id="s-layer-title">${title}</h2>${button(icon('x'),'data-close="true" aria-label="关闭"','s-quiet')}</div>${body}</section></div>`;base.inert=true;icons();layer.querySelector('button')?.focus();notify(title);}

function saveArticle(){const ar=a();if(!ar.title.trim()||!ar.body.trim()){toast('请填写文章标题和正文');return false;}ar.savedTitle=ar.title;ar.savedBody=ar.body;ar.dirty=false;ar.confirmed=false;render();toast('文章已保存');return true;}

function sceneMatrix(compact=false){const scenes=sceneLabels();return `<div class="s-evidence-map ${compact?'compact':''}" aria-label="问题与平台的品牌提及图"><div class="s-map-header"><span></span>${platforms.map(p=>`<span>${p}</span>`).join('')}</div>${scenes.map((q,j)=>`<div class="s-map-row"><div class="s-map-question">${button(q,`data-question="${j+1}" data-tooltip="${esc(questionText(j+1))}"`,'s-quiet')}</div><div class="s-map-cells">${platforms.map((p,i)=>{const pos=positions[i][j];return button(`<span class="s-mobile-platform">${p}</span><span class="s-cell-symbol">${pos===null?'—':compact?'●':pos}</span>`,`data-drawer="answer:${j+1}:${i}" aria-label="${esc(q)}，${p}，${pos===null?'未提及':'第'+pos+'位'}；查看回答" data-tooltip="${pos===null?'未提及品牌':'提及品牌 · 第'+pos+'位'}"`,'s-map-cell '+(pos===null?'absent':'mentioned'));}).join('')}</div></div>`).join('')}<div class="s-map-legend"><span>● 提及</span><span>— 未提及</span>${compact?'':'<span>数字为本条回答中的位置</span>'}</div></div>`;}
function runState(){return runs[state.brand];}
function ensureQuestions(){const run=runState(),id=state.brand;if(run.phase!=='idle')return;run.phase='preparing';setTimeout(()=>{if(runs[id].phase==='preparing'){runs[id].phase='ready';if(state.brand===id&&state.route==='report'){render();notify('评测问题已准备');}}},1100);}
function diagnosis(){const run=runState();if(run.phase==='idle'||run.phase==='preparing')return heading('准备评测问题')+`<div class="s-query-skeleton" role="status" aria-label="正在生成四个评测问题">${[0,1,2,3].map(i=>`<div><span>0${i+1}</span><b></b></div>`).join('')}</div>`;if(run.phase==='ready')return heading('评测问题','',button(icon('info'),'data-tooltip="五个平台使用同一份问题，开始评测后采样" aria-label="评测问题说明"','s-quiet'))+`<div class="s-query-list">${[0,1,2,3].map((q,i)=>`<section><span>0${i+1}</span><h2>${esc(questionText(q))}</h2>${q===0?'<small>品牌认知</small>':''}</section>`).join('')}</div><div class="s-provider-labels">${platforms.map(p=>`<span>${p}</span>`).join('')}</div><div class="s-divider-row">${go('profile','查看资料','s-quiet')}${button('开始评测','data-start-run="true"','s-primary')}</div>`;return `<div class="s-heading"><h1 id="run-title">${runLabel(run)}</h1><strong id="run-percent">${runPercent(run)}%</strong></div><div class="s-run-progress" role="progressbar" aria-label="整体评测进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${runPercent(run)}"><progress id="run-progress" max="100" value="${runPercent(run)}"></progress></div><div class="s-run-stages">${['采样','解析','汇总','报告'].map((s,i)=>`<span ${runStage(run)===i?'aria-current="step"':''}>${s}</span>`).join('')}</div><div id="run-platforms">${runPlatforms(run)}</div><section class="s-section"><div class="s-section-head"><h2>回答预览</h2>${button(run.follow?'暂停预览':'继续预览','data-follow-run="true" data-tooltip="只影响动态显示，评测仍继续"','s-quiet')}</div><div id="run-feed" aria-label="回答内容预览" aria-live="off" ${run.hidden?'hidden':''}>${runFeed(run)}</div></section><div class="s-divider-row"><small>可离开此页，稍后回来查看</small>${run.phase==='complete'?button('查看报告','data-open-result="true"','s-primary'):button('收起动态','data-hide-feed="true"','s-quiet')}</div>`;}
function runStage(run){return run.phase==='sampling'?0:run.phase==='analyzing'?1:run.phase==='resolving'?2:3;}
function runLabel(run){return {sampling:'正在采样',analyzing:'正在解析回答',resolving:'正在汇总品牌',composing:'正在生成报告',complete:'评测完成'}[run.phase]||'正在评测';}
function runPercent(run){const acquired=run.acquired.reduce((x,y)=>x+y,0),parsed=run.parsed.reduce((x,y)=>x+y,0);return run.phase==='sampling'?Math.round(8+50*acquired/20):run.phase==='analyzing'?Math.round(58+28*parsed/20):run.phase==='resolving'?90:run.phase==='composing'?96:100;}
function runPlatforms(run){return `<div class="s-run-platforms">${platforms.map((p,i)=>`<div><strong>${p}</strong><div class="s-sample-dots" aria-label="${p}，收到 ${run.acquired[i]}/4，解析 ${run.parsed[i]}/4">${[0,1,2,3].map(j=>`<span class="${j<run.parsed[i]?'parsed':j<run.acquired[i]?'acquired':''}">${j<run.parsed[i]?'✓':j<run.acquired[i]?'●':'·'}</span>`).join('')}</div><small>收到 ${run.acquired[i]}/4 · 解析 ${run.parsed[i]}/4</small></div>`).join('')}</div>`;}
function runFeed(run){if(!run.follow&&run.frozenTape)return run.frozenTape;return tapeMarkup(run);}
function paintRun(){if(state.route!=='report'||(hasReport()&&!runState().viewingProgress)||state.overlay)return;const run=runState(),title=base.querySelector('#run-title');if(!title)return;title.textContent=runLabel(run);base.querySelector('#run-percent').textContent=runPercent(run)+'%';base.querySelector('#run-progress').value=runPercent(run);base.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',runPercent(run));base.querySelector('#run-platforms').innerHTML=runPlatforms(run);base.querySelectorAll('.s-run-stages span').forEach((el,i)=>{if(i===runStage(run))el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});if(run.follow&&!run.hidden)base.querySelector('#run-feed').innerHTML=runFeed(run);icons();}
function startRun(){const run=runState(),id=state.brand;if(run.phase!=='ready')return;run.phase='sampling';run.viewingProgress=true;run.tick=0;run.sampleIndex=0;run.chunk=0;run.streamLines=[];run.events=[];run.hidden=false;run.follow=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;run.frozenTape=run.follow?'':'<div class="s-stream-window"><small>已暂停自动预览，评测继续进行。</small></div>';render();run.timer=setInterval(()=>{const r=runs[id];if(r.phase==='sampling'){const p=r.sampleIndex%5,q=Math.floor(r.sampleIndex/5);if(r.chunk===0)r.streamLines.push({p,q,text:''});const source=sampleBody(q,p,id).join(' ');r.chunk=Math.min(r.chunk+24,source.length);r.streamLines.at(-1).text=source.slice(0,r.chunk);if(r.chunk===source.length){r.acquired[p]++;r.events.push({kind:'answer',p,q,platform:platforms[p]});r.sampleIndex++;r.chunk=0;if(r.sampleIndex===20){r.phase='analyzing';r.tick=0;}}}else if(r.phase==='analyzing'){r.tick++;if(r.tick%4===0){const index=r.parsed.reduce((x,y)=>x+y,0),p=index%5,q=Math.floor(index/5);r.parsed[p]++;r.streamLines.push({p,q,text:sampleBody(q,p,id)[0]});if(index===19)r.phase='resolving';}}else if(r.phase==='resolving'){r.phase='composing';}else{r.phase='complete';reportAvailable[id]=true;clearInterval(r.timer);r.timer=null;if(state.brand===id){syncScenario();if(state.route==='report'&&!state.overlay)render();}}if(state.brand===id)paintRun();},130);}

function currentChild(v){return industryOptions.find(i=>i.id===v.primaryIndustryId)?.children.find(i=>i.id===v.secondaryIndustryId);}
function evaluationGaps(v){return [!v.companyName.trim()&&'品牌名称',!v.secondaryIndustryId&&'所属业务',currentChild(v)?.other&&v.otherProductOrService.trim().length<2&&'具体业务',v.flagshipProductOrService.trim().length<2&&'主营产品或服务',(!v.storeLocation?.confirmed)&&'门店地点',v.characteristics.filter(c=>c.title.trim().length>=2).length<2&&'至少两项特色',(!v.contactName.trim()||!/^1\d{10}$/.test(v.contactMobile))&&'联系人'].filter(Boolean);}
function writingGaps(v){return [...evaluationGaps(v),!v.articleInformation.price&&'价格说明',v.articleInformation.suitableAudienceContexts.filter(x=>x.trim().length>=2).length<2&&'至少两项客户群体'].filter(Boolean);}
function formField(key,label,value,options={}){const attrs=`id="field-${key}" aria-label="${esc(label)}" data-rich-field="${key}" ${options.max?`maxlength="${options.max}"`:''}`;return `<label class="s-field ${options.wide?'full':''}"><span>${label}</span>${options.area?`<textarea ${attrs} placeholder="${esc(options.placeholder||'')}">${esc(value)}</textarea>`:`<input ${attrs} value="${esc(value)}" placeholder="${esc(options.placeholder||'')}" ${options.type?`type="${options.type}"`:''}>`}${options.hint?`<small class="s-on-focus">${options.hint}</small>`:''}</label>`;}

function pointList(key,items,editing){const max=key==='suitableAudienceContexts'?6:5;return editing?`<div class="s-edit-list">${items.map((text,i)=>`<div class="s-inline-field"><input id="field-${key}-${i}" aria-label="${key==='suitableAudienceContexts'?'客户群体':'期望定位'} ${i+1}" data-list-field="${key}" data-index="${i}" value="${esc(text)}" maxlength="80" placeholder="${key==='suitableAudienceContexts'?'如附近居民、设备更新采购':'如适合家庭日常清洁'}">${button(icon('x'),`data-remove-list="${key}" data-index="${i}" aria-label="移除第 ${i+1} 项"`,'s-quiet')}</div>`).join('')}${items.length<max?button(icon('plus')+'自行添加',`data-add-list="${key}"`,'s-quiet'):''}</div>`:`<div class="s-tags">${items.map(t=>`<span class="s-tag">${esc(t)}</span>`).join('')||'<small>未填写</small>'}</div>`;}

function commitRichUnchecked(){const v=profileBuffer;if(!v)return true;const error=base.querySelector('#profile-error');const fail=t=>{if(error){error.hidden=false;error.textContent=t;}else toast(t);return false;};if(!v.companyName.trim())return fail('请填写品牌名称');const titles=v.characteristics.map(c=>c.title.trim()).filter(Boolean);if(titles.some(t=>t.length<2))return fail('特色名称至少填写两个字');if(new Set(titles).size!==titles.length)return fail('有重复的特色名称，请合并或修改');if(v.contactMobile&&!/^1\d{10}$/.test(v.contactMobile))return fail('请填写 11 位手机号码');if(v.characteristics.some(c=>c.detail&&c.detail.trim().length<2))return fail('特色细节至少填写两个字，也可以留空');if(v.articleInformation.suitableAudienceContexts.some(x=>x.trim().length===1)||v.articleInformation.desiredPositioning.some(x=>x.trim().length===1))return fail('人群、场景或定位至少填写两个字');if(v.flagshipProductOrService&&v.flagshipProductOrService.trim().length<2)return fail('主营产品或服务至少填写两个字');if(currentChild(v)?.other&&v.otherProductOrService&&v.otherProductOrService.trim().length<2)return fail('具体业务至少填写两个字');const p=v.articleInformation.price;if(p?.mode==='RANGE'&&(!/^\d+$/.test(String(p.minimum))||!/^\d+$/.test(String(p.maximum))||+p.minimum<=0||+p.maximum<+p.minimum))return fail('请填写正整数金额，最高金额不能低于最低金额');v.characteristics=v.characteristics.filter(c=>c.title.trim()).map(c=>({...c,title:c.title.trim()}));v.articleInformation.suitableAudienceContexts=v.articleInformation.suitableAudienceContexts.map(x=>x.trim()).filter(Boolean);v.articleInformation.desiredPositioning=v.articleInformation.desiredPositioning.map(x=>x.trim()).filter(Boolean);if(p?.mode==='RANGE'){p.minimum=Number(p.minimum);p.maximum=Number(p.maximum);}richProfiles[state.brand]=copy(v);profileChanged[state.brand]=true;Object.assign(b(),{name:v.companyName,industry:currentChild(v)?.label||'',product:v.flagshipProductOrService,character:v.characteristics.map(c=>c.title).join('、'),audience:v.articleInformation.suitableAudienceContexts.join('、'),price:p?.mode==='NEGOTIABLE'?'面议':p?`${p.minimum}–${p.maximum} 元`:'',background:v.articleInformation.supplementalBackground,positioning:v.articleInformation.desiredPositioning.join('、')});profileReady[state.brand]=writingGaps(v).length===0;profileBuffer=null;state.profileEdit=false;placeUI.open=false;syncScenario();return true;}

function ticketDetail(){const t=ticketItems.find(x=>x.id===ticketUI.active);if(!t)return supportHome();return heading(t.subject,'',`<span class="s-tag">${t.status==='RESOLVED'?'已处理':'处理中'}</span>`)+`<div class="s-ticket-detail"><section><div class="s-conversation">${t.events.map(e=>`<article class="s-conversation-message ${e.author==='我'?'mine':''}"><small>${e.author} · ${dateText(e.time)}</small><p>${esc(e.text)}</p></article>`).join('')}</div>${t.status==='PROCESSING'?`<label class="s-field">补充说明<textarea id="s-ticket-reply" placeholder="补充进展或回复客服"></textarea></label>${button('发送补充','data-ticket-reply="true"','s-primary')}`:'<p class="s-note">本次问题已处理。</p>'}</section><aside><dl class="s-facts"><div><dt>工单号</dt><dd>${t.id}</dd></div><div><dt>类型</dt><dd>${t.kind==='ORDER'?'发布订单':t.kind==='RECHARGE'?'充值问题':'普通问题'}</dd></div></dl>${t.orderId?button('查看关联订单 '+icon('arrow-up-right'),'data-ticket-order="true"','s-quiet'):''}${t.rechargeId?button('查看关联充值 '+icon('arrow-up-right'),'data-ticket-recharge="true"','s-quiet'):''}</aside></div>`;}
function validationErrors(v,full=false){const errors=[],add=(key,label,message)=>errors.push({key,label,message});if(!v.companyName.trim())add('companyName','品牌名称','请填写公司、品牌或门店名称');if(full&&!v.secondaryIndustryId)add('industry','所属行业与业务','请选择具体业务');if(currentChild(v)?.other&&v.otherProductOrService.trim().length<2)add('otherProductOrService','具体业务','至少填写两个字');if((full||v.flagshipProductOrService)&&v.flagshipProductOrService.trim().length<2)add('flagshipProductOrService','主营产品或服务','请写具体产品或服务名称');if(full&&!v.storeLocation?.confirmed)add('location','门店地点','搜索并确认一个具体地点');if(full&&!v.contactName.trim())add('contactName','联系人','填写方便联系的称呼');if((full||v.contactMobile)&&!/^1\d{10}$/.test(v.contactMobile))add('contactMobile','联系电话','请输入 11 位手机号码');const traits=v.characteristics;if((full||traits.length)&&traits.length<2)add('characteristics','优势特色','至少选择或填写 2 项');const used=new Set();traits.forEach(c=>{if(c.title.trim().length<2)add('trait-'+c.id,'特色名称','至少填写两个字');else if(used.has(c.title.trim()))add('trait-'+c.id,'特色名称','与另一项重复，请合并或修改');used.add(c.title.trim());if(c.detail&&c.detail.trim().length<2)add('detail-'+c.id,'特色细节','至少填写两个字，或留空');});const info=v.articleInformation;['suitableAudienceContexts','desiredPositioning'].forEach(key=>{const label=key==='suitableAudienceContexts'?'客户群体':'期望定位';if(key==='suitableAudienceContexts'&&info[key].length===1)add(key+'-0',label,'至少选择或填写 2 项');info[key].forEach((x,i)=>{if(x.trim().length<2)add(key+'-'+i,label,'至少填写两个字');});});if(info.price?.mode==='RANGE'){const p=info.price;if(!/^\d+$/.test(String(p.minimum))||+p.minimum<1)add('minimum','最低金额','请输入大于 0 的整数');if(!/^\d+$/.test(String(p.maximum))||+p.maximum<1)add('maximum','最高金额','请输入大于 0 的整数');else if(+p.maximum<+p.minimum)add('maximum','最高金额','不能低于最低金额');}return errors;}
function paintFieldErrors(){for(const e of formErrors){const el=base.querySelector('#field-'+e.key);if(!el)continue;el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','error-'+e.key);const message=document.createElement('small');message.id='error-'+e.key;message.className='s-field-error';message.textContent=e.message;el.insertAdjacentElement('afterend',message);}if(formErrors.length&&focusErrorSummary){base.querySelector('#s-errors button')?.focus();focusErrorSummary=false;}}
function persistRich(){formErrors=validationErrors(profileBuffer||richProfiles[state.brand]);if(formErrors.length){focusErrorSummary=true;render();return false;}return commitRichUnchecked();}
function readBrandInput(el){const v=editingBrand();if(!v)return;if(el.dataset.richField){const k=el.dataset.richField;if(k==='supplementalBackground')v.articleInformation[k]=el.value;else if(['minimum','maximum'].includes(k))v.articleInformation.price[k]=el.value;else v[k]=el.value;}if(el.dataset.trait){const c=v.characteristics.find(x=>x.id===el.dataset.id);if(c)c[el.dataset.trait]=el.value;}if(el.dataset.listField)v.articleInformation[el.dataset.listField][Number(el.dataset.index)]=el.value;const key=el.dataset.richField||(el.dataset.trait?el.dataset.trait+'-'+el.dataset.id:el.dataset.listField+'-'+el.dataset.index);const errorKey=el.dataset.trait?(el.dataset.trait==='title'?'trait':'detail')+'-'+el.dataset.id:key;formErrors=formErrors.filter(e=>e.key!==errorKey);el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby');base.querySelector('#error-'+errorKey)?.remove();base.querySelector('[data-error-focus="'+errorKey+'"]')?.closest('li')?.remove();const summary=base.querySelector('#s-errors');if(summary){if(!formErrors.length)summary.remove();else summary.querySelector('strong').textContent='请检查以下 '+formErrors.length+' 处';}if(el.dataset.richField==='maximum'){const slider=base.querySelector('[data-price-slider]');if(slider&&/^\d+$/.test(el.value)){slider.max=String(Math.max(5000,+el.value));slider.value=el.value;base.querySelector('#s-range-value').textContent='¥ '+el.value;}}const s=base.querySelector('#s-profile-status');if(s)s.textContent='未保存';}
function chipPool(v,key){const ideas=key==='positioning'?(positioningIdeas[v.primaryIndustryId]||['贴合实际需求','清晰服务范围','注重使用体验']):(sectorIdeas[v.primaryIndustryId]?.[key]||[]);return [...new Set([...ideas,...(chipUI.pools[chipScope()+':'+key]||[]),...choiceValues(v,key)])];}
function compactChoices(v,key,edit=true){const selected=choiceValues(v,key),choices=edit?chipPool(v,key):selected,max=key==='positioning'?5:6;return `<div class="s-choice-set" role="group" aria-label="${key==='positioning'?'期望定位':'客户群体与使用场景'}" id="${key==='positioning'?'field-desiredPositioning-0':'field-suitableAudienceContexts-0'}"><div class="s-choice-caption"><small>${edit?(key==='positioning'?'希望顾客如何记住你的品牌':'选择 2–6 项'):''}</small><small>${selected.length}/${max}</small></div><div class="s-choice-chips">${choices.map((text,i)=>{const chosen=selected.includes(text);return `<span class="s-compound-chip ${chosen?'chosen':''}">${edit?button(`${chosen?icon('check'):icon('plus')}<span>${esc(text)}</span>`,`data-choice-key="${key}" data-choice-index="${i}" aria-pressed="${chosen}" data-tooltip="${esc(text)}" ${!chosen&&selected.length>=max?'disabled':''}`,'s-chip-main'):`<span class="s-chip-label">${esc(text)}</span>`}</span>`;}).join('')}${edit&&selected.length<max?button(icon('plus')+'自行添加',`data-add-chip="${key}"`,'s-chip-add'):''}${!edit&&!selected.length?'<span class="s-muted">未设置</span>':''}</div>${edit?chipComposer(key):''}</div>`;}
function toggleChip(key,text){const v=editingBrand(),poolKey=chipScope()+':'+key,max=key==='positioning'?5:6;if(key==='traits'){const found=v.characteristics.find(c=>c.title===text);if(found){chipUI.cache[poolKey+':'+text]=copy(found);v.characteristics=v.characteristics.filter(c=>c.id!==found.id);}else if(v.characteristics.length<6)v.characteristics.push(chipUI.cache[poolKey+':'+text]||{id:chipScope()+'-chip-'+(++profileSequence),title:text,detail:''});else{toast('最多选择 6 项特色');return;}}else{const field=key==='positioning'?'desiredPositioning':'suitableAudienceContexts',values=v.articleInformation[field];if(values.includes(text))v.articleInformation[field]=values.filter(x=>x!==text);else if(values.length<max)values.push(text);else{toast('最多选择 '+max+' 项');return;}}formErrors=[];render();}
function rangeDraft(v){const key=chipScope();if(v.articleInformation.price?.mode==='RANGE'){const p=v.articleInformation.price;priceDrafts[key]={...p,scale:Math.max(1000,Math.ceil(Number(p.maximum)/1000)*1000,priceDrafts[key]?.scale||0)};}return priceDrafts[key]||(priceDrafts[key]={minimum:100,maximum:500,scale:1000});}
function updateRange(which,value){const v=editingBrand(),r=rangeDraft(v),n=Math.round(Number(value)/10)*10;if(which==='low')r.minimum=Math.max(10,Math.min(n,r.maximum));else r.maximum=Math.max(r.minimum,Math.min(n,r.scale));v.articleInformation.price={mode:'RANGE',minimum:r.minimum,maximum:r.maximum};const low=base.querySelector('#s-range-low'),high=base.querySelector('#s-range-high');low.value=r.minimum;high.value=r.maximum;low.setAttribute('aria-valuemax',String(r.maximum));high.setAttribute('aria-valuemin',String(r.minimum));low.setAttribute('aria-valuetext',r.minimum+' 元');high.setAttribute('aria-valuetext',r.maximum+' 元');base.querySelector('[data-price-focus="low"]').textContent='¥ '+r.minimum;base.querySelector('[data-price-focus="high"]').textContent='¥ '+r.maximum;const fill=base.querySelector('#s-range-fill');fill.setAttribute('x',String((r.minimum-10)/(r.scale-10)*100));fill.setAttribute('width',String((r.maximum-r.minimum)/(r.scale-10)*100));base.querySelector('.s-price-band').classList.remove('unset');base.querySelectorAll('[data-price-focus],.s-price-to').forEach(el=>el.hidden=false);base.querySelector('#s-unset-price').hidden=true;base.querySelector('.s-price-band-foot small').textContent='每格 10 元';base.querySelector('#s-clear-price').hidden=false;const status=base.querySelector('#s-profile-status');if(status)status.textContent='未保存';}
function extraFields(v,edit){const info=v.articleInformation;return `<div class="s-extra-units"><section class="s-field-unit" aria-labelledby="s-background-label"><div class="s-field-unit-heading"><h3 id="s-background-label">补充背景 <small>选填</small></h3>${guideBlock('background','填写示例')}</div>${edit?`<label class="s-field"><span class="s-sr">补充背景</span><textarea id="field-supplementalBackground" aria-label="补充背景" data-rich-field="supplementalBackground" maxlength="2000" placeholder="补充服务范围、交付方式或经营背景">${esc(info.supplementalBackground)}</textarea></label>`:`<p>${esc(info.supplementalBackground)||'未填写'}</p>`}</section><section class="s-field-unit" aria-labelledby="s-position-label"><div class="s-field-unit-heading"><h3 id="s-position-label">期望定位 <small>选填</small></h3>${guideBlock('position','填写示例')}</div>${compactChoices(v,'positioning',edit)}</section></div>`;}
function ordersForBrand(){return orderBook.filter(o=>o.brand===state.brand);}
function selectedOrderBase(){return ordersForBrand().find(o=>o.id===orderUI.id)||ordersForBrand()[0]||null;}
function selectedOrder(){const source=selectedOrderBase();if(!source)return null;const o=copy(source);const d=orderUI.demo;if(d==='actual'||d==='failed')return o;o.delayed=false;o.returned=null;o.agreed=0;o.ended=null;o.appealOpen=true;if(d==='pending'){o.status='PENDING_HANDLING';o.delivered=0;}if(['publishing','delayed','exception'].includes(d)){o.status=d==='exception'?'EXCEPTION_HANDLING':'PUBLISHING';o.delivered=Math.min(2,o.count-1);o.delayed=d==='delayed';}if(d==='complete'){o.status='COMPLETED';o.delivered=o.count;o.ended='2026-09-27T18:00:00+08:00';}if(d==='closed'||d==='returned'){o.status='CLOSED';o.delivered=Math.min(2,o.count-1);o.ended='2026-09-27T18:00:00+08:00';o.agreed=Math.min(200,o.cost);if(d==='returned')o.returned=o.agreed;}return o;}
function orderStatus(o){return `<span class="s-status-pill ${o.status==='EXCEPTION_HANDLING'||o.delayed?'attention':''}">${icon(o.status==='COMPLETED'?'circle-check':o.status==='CLOSED'?'circle-minus':o.status==='PENDING_HANDLING'?'clock-3':'radio')}${orderStatusNames[o.status]}</span>${o.delayed?'<span class="s-status-pill attention">已延迟</span>':''}`;}
function orderNotice(o){if(o.status==='PENDING_HANDLING')return `<div class="s-delivery-notice">${icon('clock-3')}<div><strong>等待服务方处理</strong><p>已有结果会陆续展示在下方。</p></div></div>`;if(o.status==='EXCEPTION_HANDLING')return `<div class="s-delivery-notice attention">${icon('message-circle-warning')}<div><strong>正在沟通发布安排</strong><p>具体情况与后续安排以订单会话中的沟通为准。</p></div>${button('查看沟通','data-order-support="true"','s-quiet')}</div>`;if(o.delayed)return `<div class="s-delivery-notice attention">${icon('clock-alert')}<div><strong>已超过预计完成日期</strong><p>订单仍在处理中，已有结果可以查看。</p></div>${button('询问进展','data-order-support="true"','s-quiet')}</div>`;if(o.status==='CLOSED')return `<div class="s-delivery-notice">${icon('circle-minus')}<div><strong>剩余 ${o.count-o.delivered} 篇已停止处理</strong><p>${o.returned!==null?'已退回 ⚡ '+o.returned:o.agreed?'已约定退回 ⚡ '+o.agreed+'，待结算':'本次没有约定积分返还'}</p></div>${o.returned!==null?go('points','查看积分明细','s-quiet'):button('查看沟通','data-order-support="true"','s-quiet')}</div>`;return '';}
function resultItems(o){const targets=o.kind==='precise'?o.lines.flatMap(l=>Array.from({length:l.count},()=>l.name)):[];return Array.from({length:o.kind==='precise'?o.count:o.delivered},(_,i)=>({slot:i+1,published:i<o.delivered,platform:targets[i]||['门户示例甲','地方示例甲','内容平台甲'][i%3],title:o.title,date:o.created.slice(0,10)+'T14:'+String(i%60).padStart(2,'0')+':00+08:00',stopped:o.status==='CLOSED'&&i>=o.delivered}));}
function resultCards(o){const results=resultItems(o),show=results.slice(0,orderUI.limit);return `<section class="s-delivery-results"><div class="s-section-head"><h2>发布结果</h2><small>${o.delivered}/${o.count} 篇</small></div><div class="s-result-grid">${show.map(r=>`<article class="s-result-card ${r.published?'published':'pending'}"><div class="s-result-card-head">${icon(r.published?'newspaper':r.stopped?'circle-minus':'clock-3')}<strong>${esc(r.platform)}</strong><span>${r.published?'已发布':r.stopped?'已停止':'处理中'}</span></div>${r.published?`<h3>${esc(r.title)}</h3><time>${dateText(r.date)}</time>${button('查看结果 '+icon('arrow-up-right'),`data-publication-result="${r.slot}"`,'s-quiet')}`:`<p>${r.stopped?'本篇已停止处理':'结果发布后会出现在这里'}</p>`}</article>`).join('')}${o.kind==='package'&&o.delivered<o.count?`<article class="s-result-card pending s-result-placeholder">${icon(o.status==='CLOSED'?'circle-minus':'newspaper')}<strong>${o.count-o.delivered} 篇${o.status==='CLOSED'?'已停止处理':'等待发布'}</strong><small>${o.status==='CLOSED'?'已发布结果继续保留':'媒体结果确认后逐篇展示'}</small></article>`:''}</div>${results.length>orderUI.limit?button('继续查看结果','data-more-results="true"','s-quiet'):''}</section>`;}
function commitCustomChip(key){const text=chipUI.draft.trim(),selected=choiceValues(editingBrand(),key),max=key==='positioning'?5:6;if(text.length<2){chipUI.error='至少填写两个字';render();base.querySelector('#s-custom-chip')?.focus();return;}if(selected.includes(text)){chipUI.error='这一项已经选中';render();return;}if(selected.length>=max){chipUI.error='最多选择 '+max+' 项';render();return;}const poolKey=chipScope()+':'+key;chipUI.pools[poolKey]=[...(chipUI.pools[poolKey]||[]),text];chipUI.adding=null;chipUI.draft='';chipUI.error='';toggleChip(key,text);}

if(d.ticketRecharge){stop();const t=ticketItems.find(t=>t.id===ticketUI.active),o=wallet.orders.find(o=>o.id===t?.rechargeId);if(!o){toast('暂时无法读取充值记录');return;}wallet.current=o;navigate('payment');return;}

root.addEventListener('input',e=>{if(e.target.id==='s-title'||e.target.id==='s-body'){const ar=a();ar[e.target.id==='s-title'?'title':'body']=e.target.value;ar.dirty=ar.title!==ar.savedTitle||ar.body!==ar.savedBody;if(ar.dirty)ar.confirmed=false;root.querySelector('#s-article-status').textContent=ar.dirty?'有未保存修改':'已保存';const publish=base.querySelector('.s-sticky [data-route="publishing"]');if(publish){publish.removeAttribute('data-route');publish.dataset.drawer='confirm';publish.textContent='确认文章';}}
if(['s-character','s-audience','s-background','s-positioning'].includes(e.target.id)){profileBuffer={...b(),character:base.querySelector('#s-character').value,audience:base.querySelector('#s-audience').value,background:base.querySelector('#s-background').value,positioning:base.querySelector('#s-positioning').value,price:base.querySelector('#s-price').value};root.querySelector('#s-profile-status').textContent='有未保存修改';}
if(e.target.dataset.quantity){const n=Number(e.target.value);quantities[e.target.dataset.quantity]=Number.isInteger(n)&&n>=0?Math.min(20,n):0;e.target.value=String(quantities[e.target.dataset.quantity]);root.querySelector('#s-total').textContent=totalText();}});
root.addEventListener('change',e=>{if(e.target.id==='s-scenario'){applyScenario(e.target.value);state.route='content';state.history=['home'];render();saveState();}if(e.target.id==='s-brand'){if(a().dirty||profileBuffer){pendingBrand=e.target.value;e.target.value=state.brand;open('switch');return;}state.brand=e.target.value;state.profileEdit=false;profileBuffer=null;syncScenario();state.history=[];render();saveState();}if(e.target.id==='s-question'){state.question=e.target.value;render();saveState();}if(e.target.id==='s-price'){profileBuffer={...(profileBuffer||b()),price:e.target.value};root.querySelector('#s-profile-status').textContent='有未保存修改';}});
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||!root.contains(el))return;
if(el.dataset.route){navigate(el.dataset.route);return;}if(el.dataset.back){navigate(state.history.pop()||'home',false);return;}if(el.dataset.close){close();return;}if(el.id==='s-narrow'){state.narrow=!state.narrow;root.classList.toggle('narrow',state.narrow);el.textContent=state.narrow?'恢复宽屏':'窄屏';el.setAttribute('aria-pressed',String(state.narrow));saveState();return;}
if(el.dataset.reportTab){state.reportTab=el.dataset.reportTab;render();saveState();return;}if(el.dataset.drawer){open(el.dataset.drawer,el);return;}if(el.dataset.platform){open('platform:'+el.dataset.platform,el);return;}if(el.dataset.question){state.question=el.dataset.question;state.reportTab='evidence';render();saveState();return;}
if(el.dataset.generate){if(a().exists)open('regenerate',el);else generate();return;}if(el.dataset.regenerate){generate();return;}if(el.dataset.saveArticle){saveArticle();return;}if(el.dataset.confirm){a().confirmed=true;render();toast('文章已确认，未扣积分');return;}

if(el.dataset.categoryOpen){state.category=el.dataset.categoryOpen;state.query='';state.region='全部';navigate('library');return;}if(el.dataset.filter){state.category=el.dataset.filter;render();saveState();return;}if(el.dataset.applyFilter){state.query=base.querySelector('#s-search').value.trim();state.region=base.querySelector('#s-region').value;render();return;}if(el.dataset.media){open('media:'+el.dataset.media,el);return;}if(el.dataset.package){selectedPackage=Number(el.dataset.package);open('package:'+selectedPackage,el);return;}if(el.dataset.usePackage){if(!a().exists||!a().confirmed||a().dirty)open('need-confirm');else navigate('review');return;}if(el.dataset.selection){if(!Object.values(quantities).some(Boolean)){toast('请先选择至少一个平台的发布数量');return;}open('selection',el);return;}
if(el.dataset.discardSwitch||el.dataset.saveSwitch){if(el.dataset.saveSwitch){if(a().dirty&&!saveArticle())return;if(profileBuffer){Object.assign(b(),profileBuffer);profileReady[state.brand]=!!profileBuffer.price&&profileBuffer.audience.trim().length>=2;}}if(el.dataset.discardSwitch){a().title=a().savedTitle;a().body=a().savedBody;a().dirty=false;}state.brand=pendingBrand;pendingBrand=null;state.profileEdit=false;profileBuffer=null;syncScenario();state.history=[];render();saveState();}
});
root.addEventListener('keydown',e=>{if(!state.overlay)return;if(e.key==='Escape'){e.preventDefault();close();}if(e.key==='Tab'){const els=[...layer.querySelectorAll('button,input,select,textarea,summary')].filter(el=>!el.disabled&&el.getClientRects().length),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){adopt(e.detail.globals.widgetState);render();}});
adopt(window.openai?.widgetState);if(state.route==='report'&&!hasReport())ensureQuestions();render();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{render();saveState();}});t.addToggle(state,'ops',{label:'显示预留运营位置'});}
})();
</script>
